<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Releases | EmnetMusic</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/releases.css" />
  <link rel="stylesheet" href="css/player.css" />
</head>

<body>

  <div class="app-shell">

    <aside class="sidebar">

      <div class="brand">

        <div class="brand-mark">
          E
        </div>

        <div class="brand-text">

          <span class="brand-title">
            EmnetMusic
          </span>

          <span class="brand-slogan">
            Excitement Starts Here
          </span>

        </div>

      </div>


      <nav class="sidebar-nav">

        <a
          href="home.html"
          class="nav-item"
        >
          <span class="nav-icon">⌂</span>
          <span>Home</span>
        </a>

        <a
          href="search.html"
          class="nav-item"
        >
          <span class="nav-icon">⌕</span>
          <span>Search</span>
        </a>

        <a
          href="videos.html"
          class="nav-item"
        >
          <span class="nav-icon">▶</span>
          <span>Videos</span>
        </a>

        <a
          href="library.html"
          class="nav-item"
        >
          <span class="nav-icon">▤</span>
          <span>Library</span>
        </a>

        <a
          href="playlists.html"
          class="nav-item"
        >
          <span class="nav-icon">＋</span>
          <span>Playlists</span>
        </a>

      </nav>


      <div class="sidebar-bottom">

        <a
          href="profile.html"
          class="nav-item"
        >
          <span class="nav-icon">○</span>
          <span>Profile</span>
        </a>

        <button
          type="button"
          class="nav-item logout-button"
          id="logoutButton"
        >
          <span class="nav-icon">↗</span>
          <span>Log out</span>
        </button>

      </div>

    </aside>


    <main class="main-content releases-page">

      <section class="releases-header">

        <p class="releases-label">
          DISCOVER MUSIC
        </p>

        <h1>
          Releases
        </h1>

        <p class="releases-description">
          Explore the latest singles, EPs and albums on EmnetMusic.
        </p>

      </section>


      <section class="release-filter-section">

        <button
          type="button"
          class="release-filter active"
          data-filter="all"
        >
          All
        </button>

        <button
          type="button"
          class="release-filter"
          data-filter="single"
        >
          Singles
        </button>

        <button
          type="button"
          class="release-filter"
          data-filter="ep"
        >
          EPs
        </button>

        <button
          type="button"
          class="release-filter"
          data-filter="album"
        >
          Albums
        </button>

      </section>


      <div
        class="releases-loading"
        id="releasesLoading"
      >
        Loading releases...
      </div>


      <div
        class="releases-error"
        id="releasesError"
      ></div>


      <div
        class="all-releases-grid"
        id="allReleasesGrid"
      ></div>


      <div
        class="releases-empty"
        id="releasesEmpty"
      >
        No releases available yet.
      </div>

    </main>

  </div>


  <nav class="mobile-nav">

    <a
      href="home.html"
      class="mobile-nav-item"
    >
      <span>⌂</span>
      <small>Home</small>
    </a>

    <a
      href="videos.html"
      class="mobile-nav-item"
    >
      <span>▶</span>
      <small>Videos</small>
    </a>

    <a
      href="search.html"
      class="mobile-nav-item"
    >
      <span>⌕</span>
      <small>Search</small>
    </a>

    <a
      href="library.html"
      class="mobile-nav-item"
    >
      <span>▤</span>
      <small>Library</small>
    </a>

    <a
      href="profile.html"
      class="mobile-nav-item"
    >
      <span>○</span>
      <small>Profile</small>
    </a>

  </nav>


  <div id="playerContainer"></div>


  <script src="js/config.js"></script>
  <script src="js/secureMedia.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/player.js"></script>
  <script src="js/releases.js"></script>

</body>
</html>
