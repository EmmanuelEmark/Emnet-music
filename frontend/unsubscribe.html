<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="referrer" content="no-referrer">

  <title>Unsubscribe | Emnet Music</title>

  <link rel="stylesheet" href="css/unsubscribe.css">
</head>

<body>

  <main class="container">

    <h1>Emnet Music</h1>

    <h2>Email preferences</h2>

    <p>
      Would you like to stop receiving
      this type of greeting email?
    </p>

    <button
      id="unsubscribeButton"
      type="button"
    >
      Confirm unsubscribe
    </button>

    <p
      id="message"
      role="status"
      aria-live="polite"
    ></p>

    <a href="home.html">
      Return to Emnet Music
    </a>

  </main>

  <script src="js/config.js"></script>
  <script src="js/unsubscribe.js"></script>

</body>
</html>
