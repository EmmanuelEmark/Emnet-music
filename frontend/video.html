<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Video | EmnetMusic</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/video.css" />
  <link rel="stylesheet" href="css/player.css" />
</head>

<body>

  <div class="app-shell">

    <aside class="sidebar">

      <div class="brand">

        <div class="brand-mark">
          E
        </div>

        <div class="brand-text">

          <span class="brand-title">
            EmnetMusic
          </span>

          <span class="brand-slogan">
            Excitement Starts Here
          </span>

        </div>

      </div>


      <nav class="sidebar-nav">

        <a href="home.html" class="nav-item">
          <span class="nav-icon">⌂</span>
          <span>Home</span>
        </a>

        <a href="search.html" class="nav-item">
          <span class="nav-icon">⌕</span>
          <span>Search</span>
        </a>

        <a href="videos.html" class="nav-item active">
          <span class="nav-icon">▶</span>
          <span>Videos</span>
        </a>

        <a href="library.html" class="nav-item">
          <span class="nav-icon">▤</span>
          <span>Library</span>
        </a>

        <a href="playlists.html" class="nav-item">
          <span class="nav-icon">＋</span>
          <span>Playlists</span>
        </a>

      </nav>


      <div class="sidebar-bottom">

        <a href="profile.html" class="nav-item">
          <span class="nav-icon">○</span>
          <span>Profile</span>
        </a>

        <button
          type="button"
          class="nav-item logout-button"
          id="logoutButton"
        >
          <span class="nav-icon">↗</span>
          <span>Log out</span>
        </button>

      </div>

    </aside>


    <main class="main-content video-page">

      <div
        class="video-loading"
        id="videoLoading"
      >
        Loading video...
      </div>


      <div
        class="video-error"
        id="videoError"
      ></div>


      <div
        class="video-content"
        id="videoContent"
      >

        <section class="video-player-wrapper">

          <video
            id="mainVideoPlayer"
            class="main-video-player"
            controls
            playsinline
          ></video>

        </section>


        <section class="video-information">

          <div class="video-main-info">

            <p
              class="video-type"
              id="videoType"
            >
              MUSIC VIDEO
            </p>

            <h1 id="videoTitle">
              Video title
            </h1>


            <button
              type="button"
              class="video-artist"
              id="videoArtist"
            >
              Artist
            </button>


            <div class="video-meta">

              <span id="videoViews">
                0 views
              </span>

              <span>•</span>

              <span id="videoDuration">
                0:00
              </span>

            </div>

          </div>

        </section>


        <section
          class="video-linked-section"
          id="linkedReleaseSection"
        >

          <p class="video-section-label">
            FROM THE RELEASE
          </p>

          <div
            class="video-release-card"
            id="linkedReleaseCard"
          >

            <img
              id="linkedReleaseCover"
              src=""
              alt="Release cover"
            >

            <div>

              <h3 id="linkedReleaseTitle">
                Release
              </h3>

              <p id="linkedReleaseType">
                Release
              </p>

            </div>

          </div>

        </section>


        <section
          class="video-linked-section"
          id="linkedSongSection"
        >

          <p class="video-section-label">
            LINKED SONG
          </p>

          <div class="video-song-card">

            <div>

              <h3 id="linkedSongTitle">
                Song
              </h3>

              <p id="linkedSongGenre">
                Music
              </p>

            </div>

            <span id="linkedSongDuration">
              0:00
            </span>

          </div>

        </section>

      </div>

    </main>

  </div>


  <nav class="mobile-nav">

    <a href="home.html" class="mobile-nav-item">
      <span>⌂</span>
      <small>Home</small>
    </a>

    <a href="videos.html" class="mobile-nav-item active">
      <span>▶</span>
      <small>Videos</small>
    </a>

    <a href="search.html" class="mobile-nav-item">
      <span>⌕</span>
      <small>Search</small>
    </a>

    <a href="library.html" class="mobile-nav-item">
      <span>▤</span>
      <small>Library</small>
    </a>

    <a href="profile.html" class="mobile-nav-item">
      <span>○</span>
      <small>Profile</small>
    </a>

  </nav>


  <div id="playerContainer"></div>


  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/player.js"></script>
  <script src="js/video.js"></script>

</body>
</html>
