
<!-- =========================================
     EMNET MUSIC — PLAYER COMPONENT

     Mini Player
     Expanded Now Playing
     Playback Queue
     Song Options
     Add to Playlist
     Shared Audio Engine

     Controlled by js/player.js
========================================= -->

<div class="player-system" id="playerSystem">

  <!-- =====================================
       1. MINI PLAYER
  ====================================== -->

  <div class="music-player" id="musicPlayer">

    <!-- SONG INFORMATION -->

    <button
      type="button"
      class="player-song-info player-expand-trigger"
      id="playerExpandButton"
      aria-label="Open Now Playing"
    >

      <img
        src="https://placehold.co/600x600/111612/35e67a?text=EmnetMusic"
        alt="Song cover"
        class="player-cover"
        id="playerCover"
        loading="lazy"
      >

      <div class="player-song-text">

        <div
          class="player-song-title"
          id="playerSongTitle"
        >
          Select a song
        </div>

        <div
          class="player-artist"
          id="playerArtist"
        >
          EmnetMusic
        </div>

      </div>

    </button>

    <!-- MINI PLAYER CONTROLS -->

    <div class="player-center">

      <div class="player-controls">

        <button
          type="button"
          class="player-control"
          id="previousButton"
          aria-label="Previous song"
        >
          ◀
        </button>

        <button
          type="button"
          class="player-control player-main-button"
          id="playPauseButton"
          aria-label="Play or pause"
        >
          ▶
        </button>

        <button
          type="button"
          class="player-control"
          id="nextButton"
          aria-label="Next song"
        >
          ▶▶
        </button>

      </div>

      <!-- MINI PLAYER PROGRESS -->

      <div class="player-progress-row">

        <span
          class="player-time"
          id="currentTime"
        >
          0:00
        </span>

        <input
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
          class="player-progress"
          id="playerProgress"
          aria-label="Song progress"
        >

        <span
          class="player-time"
          id="durationTime"
        >
          0:00
        </span>

      </div>

    </div>

    <!-- MINI PLAYER RIGHT CONTROLS -->

    <div class="player-right">

      <!-- LIKE SONG -->

      <button
        type="button"
        class="mini-action-button"
        id="miniLikeButton"
        aria-label="Like song"
        aria-pressed="false"
      >
        ♡
      </button>

      <!-- VOLUME -->

      <div class="mini-volume">

        <span
          class="volume-icon"
          aria-hidden="true"
        >
          🔊
        </span>

        <input
          type="range"
          min="0"
          max="1"
          value="0.8"
          step="0.01"
          class="volume-slider"
          id="volumeSlider"
          aria-label="Volume"
        >

      </div>

      <!-- EXPAND PLAYER -->

      <button
        type="button"
        class="mini-action-button expand-icon-button"
        id="playerExpandIconButton"
        aria-label="Expand player"
      >
        ↗
      </button>

    </div>

  </div>

  <!-- =====================================
       2. EXPANDED NOW PLAYING
  ====================================== -->

  <section
    class="now-playing-overlay"
    id="nowPlayingOverlay"
    aria-hidden="true"
    aria-label="Now Playing"
  >

    <div class="now-playing-shell">

      <!-- HEADER -->

      <header class="now-playing-header">

        <div>

          <p class="now-playing-label">
            NOW PLAYING
          </p>

          <p class="now-playing-brand">
            EmnetMusic
          </p>

        </div>

        <button
          type="button"
          class="now-playing-close"
          id="closeNowPlayingButton"
          aria-label="Close Now Playing"
        >
          ↓
        </button>

      </header>

      <!-- MAIN NOW PLAYING AREA -->

      <div class="now-playing-content">

        <!-- ARTWORK SIDE -->

        <div class="now-playing-artwork-section">

          <div class="now-playing-artwork-wrap">

            <div
              class="artwork-glow"
              aria-hidden="true"
            ></div>

            <img
              src="https://placehold.co/600x600/111612/35e67a?text=EmnetMusic"
              alt="Current song artwork"
              class="now-playing-artwork"
              id="expandedPlayerCover"
            >

          </div>

        </div>

        <!-- SONG DETAILS SIDE -->

        <div class="now-playing-details">

          <!-- SONG INFORMATION -->

          <div class="now-playing-song-meta">

            <p class="now-playing-context">
              Playing from EmnetMusic
            </p>

            <h1 id="expandedSongTitle">
              Select a song
            </h1>

            <span
              class="expanded-artist-name"
              id="expandedArtistName"
            >
              EmnetMusic
            </span>

          </div>

          <!-- ACTION BUTTONS -->

          <div class="now-playing-actions">

            <!-- LIKE -->

            <button
              type="button"
              class="now-playing-action"
              id="expandedLikeButton"
              aria-label="Like song"
              aria-pressed="false"
            >
              <span aria-hidden="true">♡</span>
              <small>Like</small>
            </button>

            <!-- QUEUE -->

            <button
              type="button"
              class="now-playing-action"
              id="queueToggleButton"
              aria-label="Open playback queue"
              aria-controls="queuePanel"
              aria-expanded="false"
            >
              <span aria-hidden="true">☷</span>
              <small>Queue</small>
            </button>

            <!-- MORE OPTIONS -->

            <button
              type="button"
              class="now-playing-action"
              id="moreSongButton"
              aria-label="More song options"
              aria-haspopup="dialog"
            >
              <span aria-hidden="true">•••</span>
              <small>More</small>
            </button>

          </div>

          <!-- =====================================
               EXPANDED PROGRESS
          ====================================== -->

          <div class="expanded-progress">

            <input
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
              class="expanded-progress-slider"
              id="expandedProgress"
              aria-label="Song progress"
            >

            <div class="expanded-time-row">

              <span id="expandedCurrentTime">
                0:00
              </span>

              <span id="expandedDurationTime">
                0:00
              </span>

            </div>

          </div>

          <!-- =====================================
               EXPANDED PLAYER CONTROLS
          ====================================== -->

          <div class="expanded-controls">

            <!-- SHUFFLE — DEFERRED -->

            <button
              type="button"
              class="expanded-secondary-control"
              id="shuffleButton"
              aria-label="Shuffle (coming later)"
              title="Shuffle — coming later"
              disabled
            >
              ⤨
            </button>

            <!-- PREVIOUS SONG -->

            <button
              type="button"
              class="expanded-skip-button"
              id="expandedPreviousButton"
              aria-label="Previous song"
            >
              ◀
            </button>

            <!-- PLAY / PAUSE -->

            <button
              type="button"
              class="expanded-main-control"
              id="expandedPlayPauseButton"
              aria-label="Play or pause"
            >
              ▶
            </button>

            <!-- NEXT SONG -->

            <button
              type="button"
              class="expanded-skip-button"
              id="expandedNextButton"
              aria-label="Next song"
            >
              ▶
            </button>

            <!-- REPEAT — DEFERRED -->

            <button
              type="button"
              class="expanded-secondary-control"
              id="repeatButton"
              aria-label="Repeat (coming later)"
              title="Repeat — coming later"
              disabled
            >
              ↻
            </button>

          </div>

          <!-- =====================================
               EXPANDED VOLUME
          ====================================== -->

          <div class="expanded-volume">

            <span aria-hidden="true">
              🔊
            </span>

            <input
              type="range"
              min="0"
              max="1"
              value="0.8"
              step="0.01"
              id="expandedVolumeSlider"
              aria-label="Volume"
            >

          </div>

        </div>

      </div>

      <!-- =====================================
           3. PLAYBACK QUEUE
      ====================================== -->

      <aside
        class="queue-panel"
        id="queuePanel"
        aria-label="Playback queue"
      >

        <div class="queue-header">

          <div>

            <p class="queue-label">
              NEXT UP
            </p>

            <h2>Queue</h2>

          </div>

          <button
            type="button"
            id="closeQueueButton"
            class="queue-close-button"
            aria-label="Close playback queue"
          >
            ×
          </button>

        </div>

        <div
          class="queue-list"
          id="queueList"
        >

          <div class="queue-empty">
            Your queue will appear here.
          </div>

        </div>

      </aside>

    </div>

  </section>

  <!-- =====================================
       4. MORE SONG OPTIONS MODAL
  ====================================== -->

  <div
    class="song-more-modal"
    id="songMoreModal"
    role="dialog"
    aria-modal="true"
    aria-label="Song options"
    aria-hidden="true"
  >

    <div class="song-more-card">

      <!-- HEADER -->

      <div class="song-more-header">

        <div>

          <p class="song-more-label">
            SONG OPTIONS
          </p>

          <h2 id="songMoreTitle">
            Song
          </h2>

        </div>

        <button
          type="button"
          class="song-more-close"
          id="closeSongMoreModal"
          aria-label="Close song options"
        >
          ×
        </button>

      </div>

      <!-- SONG OPTIONS -->

      <div class="song-more-options">

        <!-- ADD TO PLAYLIST -->

        <button
          type="button"
          class="song-more-option"
          id="moreAddToPlaylist"
        >

          <span
            class="song-more-icon"
            aria-hidden="true"
          >
            ＋
          </span>

          <div>

            <strong>
              Add to playlist
            </strong>

            <small>
              Save this song to one of your playlists
            </small>

          </div>

        </button>

        <!-- GO TO ARTIST -->

        <button
          type="button"
          class="song-more-option"
          id="moreGoToArtist"
        >

          <span
            class="song-more-icon"
            aria-hidden="true"
          >
            ♫
          </span>

          <div>

            <strong>
              Go to artist
            </strong>

            <small>
              View the artist profile
            </small>

          </div>

        </button>

        <!-- GO TO RELEASE -->

        <button
          type="button"
          class="song-more-option"
          id="moreGoToRelease"
        >

          <span
            class="song-more-icon"
            aria-hidden="true"
          >
            ▣
          </span>

          <div>

            <strong>
              Go to release
            </strong>

            <small>
              View the album, EP or single
            </small>

          </div>

        </button>

        <!-- SHARE SONG -->

        <button
          type="button"
          class="song-more-option"
          id="moreShareSong"
        >

          <span
            class="song-more-icon"
            aria-hidden="true"
          >
            ↗
          </span>

          <div>

            <strong>
              Share
            </strong>

            <small>
              Share this song
            </small>

          </div>

        </button>

      </div>

      <!-- MESSAGE -->

      <div
        class="song-more-message"
        id="songMoreMessage"
        role="status"
        aria-live="polite"
      ></div>

    </div>

  </div>

  <!-- =====================================
       5. ADD TO PLAYLIST MODAL
  ====================================== -->

  <div
    class="player-playlist-modal"
    id="playerPlaylistModal"
    role="dialog"
    aria-modal="true"
    aria-label="Add song to playlist"
    aria-hidden="true"
  >

    <div class="player-playlist-card">

      <!-- HEADER -->

      <div class="player-playlist-header">

        <div>

          <p class="player-playlist-label">
            SAVE SONG
          </p>

          <h2>
            Add to playlist
          </h2>

        </div>

        <button
          type="button"
          class="player-playlist-close"
          id="closePlayerPlaylistModal"
          aria-label="Close add to playlist"
        >
          ×
        </button>

      </div>

      <!-- SELECTED SONG -->

      <p
        class="player-playlist-song"
        id="playerPlaylistSongName"
      >
        Select a song
      </p>

      <!-- PLAYLIST MESSAGE -->

      <div
        class="player-playlist-message"
        id="playerPlaylistMessage"
        role="status"
        aria-live="polite"
      ></div>

      <!-- PLAYLIST LIST -->

      <div
        class="player-playlist-list"
        id="playerPlaylistList"
      >

        <div class="player-playlist-loading">
          Loading playlists...
        </div>

      </div>

    </div>

  </div>

  <!-- =====================================
       6. SHARED AUDIO ENGINE

       One audio element controls both
       mini and expanded player views.

       Audio source is assigned dynamically
       by player.js using secure R2 URLs.
  ====================================== -->

  <audio
    id="audioPlayer"
    preload="metadata"
  ></audio>

</div>
